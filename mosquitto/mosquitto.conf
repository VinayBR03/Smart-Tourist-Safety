# =================================================================
# Mosquitto MQTT Broker Configuration
# CrowdGuard / Sentinel Tour
# =================================================================

# ── Network ──────────────────────────────────────────────────────

# Listen on standard MQTT port
listener 1883

# Bind to all interfaces so Docker containers can connect
bind_address 0.0.0.0


# ── Authentication ────────────────────────────────────────────────
# Allow anonymous for development.
# For production: set to false and configure password_file.

allow_anonymous true

# Production example (uncomment and create password file):
# allow_anonymous false
# password_file /mosquitto/config/passwd


# ── Persistence ───────────────────────────────────────────────────
# Persist messages to disk so in-flight telemetry survives
# a broker restart. Critical for QoS 1 wristband messages.

persistence      true
persistence_location /mosquitto/data/

# Save persistence file every 30 seconds and on broker stop
autosave_interval 30
autosave_on_changes false


# ── Logging ───────────────────────────────────────────────────────

log_dest   stdout
log_type   error
log_type   warning
log_type   notice
log_type   information

# Uncomment for debugging connection issues:
# log_type   debug
# log_type   subscribe
# log_type   unsubscribe


# ── Connection limits ─────────────────────────────────────────────
# At pilgrimage scale: 100k tourists + Go worker + backend tests

# Max concurrent connections (0 = unlimited)
max_connections  -1

# Keep-alive timeout (seconds) — wristbands send heartbeat every 30s
# Set to 3x heartbeat interval as a safe buffer
keepalive_interval 90

# Max inflight QoS 1/2 messages per client
max_inflight_messages 100

# Max queued messages for disconnected clients with persistent session
max_queued_messages 1000


# ── Message size ──────────────────────────────────────────────────
# Wristband payload is small JSON (~300 bytes).
# Cap at 64KB to prevent abuse.

message_size_limit 65536