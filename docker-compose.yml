version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: tourist_postgres
    environment:
      POSTGRES_USER: tourist_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: tourist_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tourist_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: tourist_backend
    depends_on:
      - postgres
      - redis
      - ai-engine
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"

  celery:
    build: ./backend
    container_name: tourist_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    env_file:
      - ./backend/.env.docker

  ai-engine:
    build: ./ai_engine
    container_name: tourist_ai_engine
    ports:
      - "8001:8001"

volumes:
  postgres_data: