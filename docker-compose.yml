version: "3.9"

# =================================================================
# Sentinel Tour — Docker Compose
# =================================================================
# Before first run:
#   1. Copy backend/.env.docker and fill in secrets
#   2. Copy ai_engine/.env.docker and fill in token
#   3. Run: docker compose up -d postgres redis
#   4. Run: docker compose run --rm backend alembic upgrade head
#   5. Run: docker compose up -d
# =================================================================

services:

  # ═══════════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════════

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tourist_postgres
    environment:
      # ← UPDATE: change strongpassword before deploying
      POSTGRES_USER:     tourist_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB:       tourist_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist_user -d tourist_safety_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tourist_redis
    # ← UPDATE: add --requirepass your_password for production
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tourist_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      # Use TCP check — mosquitto_pub may not be available in all builds
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tourist_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tourist_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════
  # Application Services
  # ═══════════════════════════════════════════

  ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: tourist_ai_engine
    env_file:
      - ./ai_engine/.env.docker
    ports:
      - "8001:8001"
    volumes:
      # Model artifacts persist across deploys — never baked into image.
      # Retraining tasks write here; model_registry reads from here.
      - ./ai_engine/artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # service_started (not service_healthy) — backend falls back
      # to rule-based scoring if AI engine is still loading models.
      # Using service_healthy here would block backend startup for
      # up to 90s waiting for LSTM model load.
      ai-engine:
        condition: service_started
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      # Firebase service account for FCM push notifications.
      # Only needed when ENABLE_PUSH=True.
      - ./backend/app/secrets/sentinel-tour-firebase-adminsdk-fbsvc-c87847b6c7.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_celery
    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 15s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_celery_beat
    # Use default PersistentScheduler — stores schedule in celerybeat-schedule file.
    # django_celery_beat is Django-only and won't work with FastAPI.
    # For Redis-backed distributed beat use redbeat (add to requirements.txt).
    command: >
      celery -A app.core.celery_app.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    volumes:
      # Persist beat schedule so periodic tasks survive restarts
      - celerybeat_data:/app/celerybeat-schedule
    restart: unless-stopped

  mqtt-ingestion:
    build:
      context: ./mqtt_ingestion
      dockerfile: Dockerfile
    container_name: tourist_mqtt_ingestion
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MQTT_BROKER:       tcp://mosquitto:1883
      MQTT_TOPIC_PREFIX: crowdguard
      KAFKA_BROKERS:     kafka:9092
      KAFKA_TOPIC:       iot.telemetry
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # Frontend
  # ═══════════════════════════════════════════

  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: tourist_web_dashboard
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  zookeeper_data:
  kafka_data:
  celerybeat_data: