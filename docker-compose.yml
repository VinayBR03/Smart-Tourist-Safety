# =================================================================
# Sentinel Tour — Docker Compose
# =================================================================

services:

  # ═══════════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════════

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: tourist_postgres
    environment:
      POSTGRES_USER:     tourist_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB:       tourist_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist_user -d tourist_safety_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tourist_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tourist_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tourist_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tourist_kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS:                        PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS:     6000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS:  6000
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # Application Services
  # ═══════════════════════════════════════════

  ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: tourist_ai_engine
    env_file:
      - ./ai_engine/.env.docker
    ports:
      - "8001:8001"
    volumes:
      - ./ai_engine/artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      ai-engine:
        condition: service_started
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/secrets/sentinel-tour-firebase-adminsdk-fbsvc-c87847b6c7.json:/app/secrets/firebase-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_celery
    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 15s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_celery_beat
    command: >
      celery -A app.core.celery_app.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    healthcheck:
      disable: true

  mqtt-ingestion:
    build:
      context: ./mqtt_ingestion
      dockerfile: Dockerfile
    container_name: tourist_mqtt_ingestion
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      MQTT_BROKER:       tcp://mosquitto:1883
      MQTT_TOPIC_PREFIX: crowdguard
      KAFKA_BROKERS:     kafka:29092
      KAFKA_TOPIC:       iot.telemetry
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # Frontend
  # ═══════════════════════════════════════════

  web-dashboard:
    build:
      context: ./frontend/web-dashboard
      dockerfile: Dockerfile
    container_name: tourist_web_dashboard
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  zookeeper_data:
  kafka_data: