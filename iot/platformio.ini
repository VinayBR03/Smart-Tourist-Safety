[platformio]
default_envs = wristband, node, gateway

; ─────────────────────────────────────────────
; SHARED BASE — wristband and node only
; ─────────────────────────────────────────────
[env_base]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit INA219 @ ^1.2.3
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    electroniccats/MPU6050 @ ^1.3.0
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    bblanchon/ArduinoJson @ ^7.1.0

; ─────────────────────────────────────────────
; WRISTBAND — ESP32-C3 Super Mini
; ─────────────────────────────────────────────
[env:wristband]
extends = env_base
platform = espressif32
board = esp32-c3-devkitm-1
build_src_filter = +<wristband/> +<../include/>
build_flags =
    ${env_base.build_flags}
    -DWRISTBAND_BUILD

; ─────────────────────────────────────────────
; NODE — ESP32 WROOM-32
; ─────────────────────────────────────────────
[env:node]
extends = env_base
platform = espressif32
board = esp32dev
build_src_filter = +<node/> +<../include/>
build_flags =
    ${env_base.build_flags}
    -DNODE_BUILD

; ─────────────────────────────────────────────
; GATEWAY — ESP32 WROOM-32
; Does NOT extend env_base — has its own trimmed lib_deps.
; Gateway uses none of: MAX30102, MPU6050, MFRC522, MLX90614, BMP280.
; NTP sync is handled by the ESP32 Arduino built-in configTime() — no NTPClient needed.
; ─────────────────────────────────────────────
[env:gateway]
framework = arduino
monitor_speed = 115200
platform = espressif32
board = esp32dev
build_src_filter = +<gateway/> +<../include/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -DGATEWAY_BUILD
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit INA219 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.1.0

; ─────────────────────────────────────────────
; NATIVE — Unit tests (runs on host PC, no hardware)
; ─────────────────────────────────────────────
[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -DDEBUG_SERIAL
    -I include
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0